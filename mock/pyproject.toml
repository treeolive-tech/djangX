[project]
name = "djangX-app"
version = "0.1.0"
readme = "README.md"
settings = "app.settings"
authors = [{ name = "Kevin Wakhisi", email = "kevin@treeolive.tech" }]
requires-python = ">=3.14,<3.15"
dependencies = ["djangx[vercel]>=0.1.0.dev11", "django-dart-sass"]

[tool.vercel.scripts]
build = "npm i -g sass-embedded && djx sass --build && djx makemigrations && djx migrate"

[tool.uv.sources]
djangx = { workspace = true }
django-dart-sass = { git = "https://github.com/kvnwaks/django-dart-sass.git", branch = "djv6-support" }
