[project]
name = "djangX-app"
version = "0.1.0"
readme = "README.md"
authors = [{ name = "Kevin Wakhisi", email = "kevin@treeolive.tech" }]
requires-python = ">=3.14,<3.15"
dependencies = ["djangx[postgres,vercel]>=0.1.0.dev19"]

[tool.vercel.scripts]
build = "npm i -g sass-embedded && djx sass --build && djx makemigrations && djx migrate"

[tool.uv.sources]
djangx = { workspace = true }
