[tool.uv.workspace]
members = ["djangx", "mock"]

[dependency-groups]
dev = ["django-stubs>=6.1.2", "djlint>=1.46.6", "poethepoet>=0.49.0"]

[tool.uv]
preview-features = ["format-command", "check-command"]

[tool.poe.tasks.format]
sequence = [{ cmd = "uv format" }, { cmd = "djlint . --reformat" }]

[tool.poe.tasks.lint]
sequence = [
    { cmd = "uv format --check" },
    { cmd = "uv check" },
    { cmd = "djlint . --check" },
    { cmd = "djlint . --lint" },
]

[tool.poe.tasks.add]
sequence = [{ ref = "lint" }, { cmd = "git add ." }]

[tool.ruff]
exclude = ["*/migrations/*"]

[tool.djlint]
format_css = true
format_js = true
blank_line_before_tag = "block,list"
blank_line_after_tag = "endblock,endlist"
ignore = "H016,H030,H031"
