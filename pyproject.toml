[project]
name = "treeolive"
version = "0.1.0.dev1"
description = "Add your description here"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kevin Wakhisi", email = "kevin@treeolive.tech" }]
requires-python = ">=3.12"
dependencies = ["django>=6.1.2"]

[project.scripts]
treeolive = "treeolive:main"
toli = "treeolive:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["poethepoet>=0.49.0"]

[tool.poe.tasks.format]
sequence = [{ cmd = "uv format --preview-features format-command" }]

[tool.poe.tasks.lint]
sequence = [
    { cmd = "uv lock --check" },
    { cmd = "uv check --preview-features check-command" },
]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true
